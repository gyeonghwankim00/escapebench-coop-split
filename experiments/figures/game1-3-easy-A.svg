<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>당구장 — A</title><rect width="1200" height="860" fill="#f5f7fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="35" font-size="24" fill="#243247" font-weight="700">분할 후 역할 A 영역 · 당구장</text><text x="40" y="60" font-size="14" fill="#243247" font-weight="400">개념 평면도 · 실제 치수/방향 아님 · 숫자는 원본 장면 번호 · 세부 이동은 연결 목록 참조</text><path d="M 215.0 175.0 L 215.0 475.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 215.0 175.0 L 605.0 175.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 215.0 175.0 L 995.0 535.0" fill="none" stroke="#b38024" stroke-width="5" stroke-dasharray="9 7"/><rect x="40" y="100" width="350" height="150" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="55" y="128" font-size="21" fill="#243247" font-weight="700">01  복도</text><text x="55" y="151" font-size="12" fill="#243247" font-weight="400">the hallway</text><text x="55" y="176" font-size="13" fill="#805b19" font-weight="400">A 시작</text><rect x="40" y="400" width="350" height="150" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="55" y="428" font-size="21" fill="#243247" font-weight="700">02  복도 왼쪽 구석</text><text x="55" y="451" font-size="12" fill="#243247" font-weight="400">left corner of the hallway</text><text x="55" y="476" font-size="13" fill="#805b19" font-weight="400">A 배정</text><rect x="430" y="100" width="350" height="150" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="445" y="128" font-size="21" fill="#243247" font-weight="700">03  엘리베이터실</text><text x="445" y="151" font-size="12" fill="#243247" font-weight="400">the elevator room</text><text x="445" y="176" font-size="13" fill="#805b19" font-weight="400">A 배정</text><rect x="820" y="400" width="350" height="270" rx="8" fill="#eceef1" stroke="#b6beca" stroke-width="3"/><text x="835" y="428" font-size="21" fill="#243247" font-weight="700">04  당구장 · 상대 구역</text><text x="835" y="451" font-size="12" fill="#243247" font-weight="400">the billiard room</text><text x="835" y="476" font-size="13" fill="#805b19" font-weight="400">원본 초기 hidden</text><text x="835" y="512" font-size="15" fill="#687386" font-weight="400">이 역할은 내부에서 직접 행동 불가</text><text x="40" y="815" font-size="14" fill="#243247" font-weight="400">실선: 원본의 구역 간 연결 존재(방향·가시 조건은 아래 목록)   점선: A/B를 가르는 원본 연결</text><text x="40" y="840" font-size="13" fill="#243247" font-weight="400">hidden은 장면 자체의 초기 값. 하위 장면이 visible이어도 부모 진입이 막히면 접근 불가. 회색은 설명용이며 모델에 제공하지 않음.</text></g></svg>