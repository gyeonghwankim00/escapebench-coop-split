<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>거울과 작업실 — A</title><rect width="1200" height="860" fill="#f5f7fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="35" font-size="24" fill="#243247" font-weight="700">분할 후 역할 A 영역 · 거울과 작업실</text><text x="40" y="60" font-size="14" fill="#243247" font-weight="400">개념 평면도 · 실제 치수/방향 아님 · 숫자는 원본 장면 번호 · 세부 이동은 연결 목록 참조</text><path d="M 215.0 165.0 L 215.0 590.0" fill="none" stroke="#b38024" stroke-width="5" stroke-dasharray="9 7"/><path d="M 215.0 165.0 L 605.0 202.5" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 215.0 165.0 L 995.0 265.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 605.0 202.5 L 605.0 520.0" fill="none" stroke="#b38024" stroke-width="5" stroke-dasharray="9 7"/><rect x="40" y="80" width="350" height="170" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="55" y="108" font-size="21" fill="#243247" font-weight="700">01  거실</text><text x="55" y="131" font-size="12" fill="#243247" font-weight="400">living room</text><text x="55" y="156" font-size="13" fill="#805b19" font-weight="400">A 시작</text><rect x="52" y="172" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="62" y="196" font-size="16" fill="#243247" font-weight="400">02  전화 수납장 [hidden]</text><rect x="430" y="80" width="350" height="245" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="445" y="108" font-size="21" fill="#243247" font-weight="700">03  침실</text><text x="445" y="131" font-size="12" fill="#243247" font-weight="400">bedroom</text><text x="445" y="156" font-size="13" fill="#805b19" font-weight="400">A 배정</text><rect x="442" y="172" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="452" y="196" font-size="16" fill="#243247" font-weight="400">04  공구상자</text><rect x="442" y="214" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="452" y="238" font-size="16" fill="#243247" font-weight="400">05  종이상자</text><rect x="430" y="405" width="350" height="230" rx="8" fill="#eceef1" stroke="#b6beca" stroke-width="3"/><text x="445" y="433" font-size="21" fill="#243247" font-weight="700">06  욕실 · 상대 구역</text><text x="445" y="456" font-size="12" fill="#243247" font-weight="400">bathroom</text><text x="445" y="481" font-size="13" fill="#805b19" font-weight="400">원본 초기 hidden</text><text x="445" y="517" font-size="15" fill="#687386" font-weight="400">이 역할은 내부에서 직접 행동 불가</text><rect x="40" y="405" width="350" height="370" rx="8" fill="#eceef1" stroke="#b6beca" stroke-width="3"/><text x="55" y="433" font-size="21" fill="#243247" font-weight="700">09  식당·주방 · 상대 구역</text><text x="55" y="456" font-size="12" fill="#243247" font-weight="400">dining room and kitchen</text><text x="55" y="481" font-size="13" fill="#805b19" font-weight="400">B 배정</text><text x="55" y="517" font-size="15" fill="#687386" font-weight="400">이 역할은 내부에서 직접 행동 불가</text><rect x="820" y="80" width="350" height="370" rx="8" fill="#e1eefc" stroke="#2866aa" stroke-width="3"/><text x="835" y="108" font-size="21" fill="#243247" font-weight="700">16  서재</text><text x="835" y="131" font-size="12" fill="#243247" font-weight="400">study</text><text x="835" y="156" font-size="13" fill="#805b19" font-weight="400">원본 초기 hidden</text><rect x="832" y="172" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="196" font-size="16" fill="#243247" font-weight="400">17  서재 벽</text><rect x="832" y="214" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="238" font-size="16" fill="#243247" font-weight="400">18  사진</text><rect x="832" y="256" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="280" font-size="16" fill="#243247" font-weight="400">19  책상</text><rect x="832" y="298" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="322" font-size="16" fill="#243247" font-weight="400">20  사물함</text><text x="40" y="815" font-size="14" fill="#243247" font-weight="400">실선: 원본의 구역 간 연결 존재(방향·가시 조건은 아래 목록)   점선: A/B를 가르는 원본 연결</text><text x="40" y="840" font-size="13" fill="#243247" font-weight="400">hidden은 장면 자체의 초기 값. 하위 장면이 visible이어도 부모 진입이 막히면 접근 불가. 회색은 설명용이며 모델에 제공하지 않음.</text></g></svg>