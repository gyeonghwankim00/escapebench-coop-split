<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img"><title>지하 연구실 — original</title><rect width="1200" height="860" fill="#f5f7fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif"><text x="40" y="35" font-size="24" fill="#243247" font-weight="700">원본 전체 공간 · 지하 연구실</text><text x="40" y="60" font-size="14" fill="#243247" font-weight="400">개념 평면도 · 실제 치수/방향 아님 · 숫자는 원본 장면 번호 · 세부 이동은 연결 목록 참조</text><path d="M 215.0 175.0 L 215.0 515.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 215.0 175.0 L 605.0 175.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 605.0 175.0 L 995.0 255.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><path d="M 995.0 255.0 L 995.0 610.0" fill="none" stroke="#7e91a8" stroke-width="5" stroke-dasharray="none"/><rect x="40" y="100" width="350" height="150" rx="8" fill="#e9eff7" stroke="#344f74" stroke-width="3"/><text x="55" y="128" font-size="21" fill="#243247" font-weight="700">01  지하실 입구</text><text x="55" y="151" font-size="12" fill="#243247" font-weight="400">basement entrance</text><text x="55" y="176" font-size="13" fill="#805b19" font-weight="400">원본 시작</text><rect x="40" y="400" width="350" height="230" rx="8" fill="#e9eff7" stroke="#344f74" stroke-width="3"/><text x="55" y="428" font-size="21" fill="#243247" font-weight="700">02  지하실 왼쪽</text><text x="55" y="451" font-size="12" fill="#243247" font-weight="400">basement leftside</text><text x="55" y="476" font-size="13" fill="#805b19" font-weight="400"></text><rect x="52" y="492" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="62" y="516" font-size="16" fill="#243247" font-weight="400">03  제어 장치</text><rect x="430" y="100" width="350" height="150" rx="8" fill="#e9eff7" stroke="#344f74" stroke-width="3"/><text x="445" y="128" font-size="21" fill="#243247" font-weight="700">04  문 뒤 복도</text><text x="445" y="151" font-size="12" fill="#243247" font-weight="400">hallway behind door</text><text x="445" y="176" font-size="13" fill="#805b19" font-weight="400">원본 초기 hidden</text><rect x="820" y="100" width="350" height="310" rx="8" fill="#e9eff7" stroke="#344f74" stroke-width="3"/><text x="835" y="128" font-size="21" fill="#243247" font-weight="700">05  연구실</text><text x="835" y="151" font-size="12" fill="#243247" font-weight="400">lab room overview</text><text x="835" y="176" font-size="13" fill="#805b19" font-weight="400"></text><rect x="832" y="192" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="216" font-size="16" fill="#243247" font-weight="400">06  컴퓨터 책상</text><rect x="832" y="234" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="258" font-size="16" fill="#243247" font-weight="400">07  금고 벽</text><rect x="832" y="276" width="326" height="36" rx="4" fill="#ffffff" stroke="#bcc8d6"/><text x="842" y="300" font-size="16" fill="#243247" font-weight="400">08  실험 테이블</text><rect x="820" y="535" width="350" height="150" rx="8" fill="#e9eff7" stroke="#344f74" stroke-width="3"/><text x="835" y="563" font-size="21" fill="#243247" font-weight="700">09  캐빈실</text><text x="835" y="586" font-size="12" fill="#243247" font-weight="400">cabin room</text><text x="835" y="611" font-size="13" fill="#805b19" font-weight="400">원본 초기 hidden</text><text x="40" y="815" font-size="14" fill="#243247" font-weight="400">실선: 원본의 구역 간 연결 존재(방향·가시 조건은 아래 목록)   점선: A/B를 가르는 원본 연결</text><text x="40" y="840" font-size="13" fill="#243247" font-weight="400">hidden은 장면 자체의 초기 값. 하위 장면이 visible이어도 부모 진입이 막히면 접근 불가. 회색은 설명용이며 모델에 제공하지 않음.</text></g></svg>